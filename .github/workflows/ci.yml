name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install voice codec dependencies
        run: sudo apt-get update && sudo apt-get install -y libopus-dev pkg-config
      - run: make check test build
      - name: Verify real browser DOM and iframe interaction
        env:
          LINXI_BROWSER_TEST_BIN: /usr/bin/google-chrome
        run: go test ./cmd/device-display -run TestBrowserDOMWithChromium -v
      - name: Verify voice codec and browser audio
        run: |
          make voice-test voice-build
          node --test internal/voice/test/*.test.mjs
      - name: Generate coverage report
        run: make coverage
      - name: Retain coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profiles
          path: |
            coverage.out
            coverage-production.out
          if-no-files-found: error
