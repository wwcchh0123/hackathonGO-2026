# One ngrok endpoint for the two local services:
#   /mcp, /display/ -> the independent control MCP and session page
#   /device/mcp     -> the simulated Linxi device MCP
#
# Both MCP transports are SSE, so buffering and HTTP/1.1 upgrades must stay
# disabled/enabled as shown below.
events {}

http {
    server {
        listen 8000;
        server_name _;

        location /device/ {
            proxy_pass http://127.0.0.1:8787/;
            proxy_http_version 1.1;
            # The Go MCP SDK rejects a public Host when its upstream listener is
            # loopback. Pass the upstream host while keeping the public URL in
            # the control service configuration.
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-Prefix /device;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 1h;
        }

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
    }
}
