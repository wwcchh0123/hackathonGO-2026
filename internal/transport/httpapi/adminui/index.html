<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Control Center · 设备管理</title>
    <link rel="stylesheet" href="/admin-assets/style.css" />
  </head>
  <body>
    <section class="login" id="login" hidden>
      <h1>Control Center</h1>
      <p id="login-error">需要控制服务访问令牌</p>
      <form id="connect"><input id="token" type="password" aria-label="控制服务访问令牌" autocomplete="current-password" /><button>连接</button></form>
    </section>
    <div class="app" id="app" hidden>
      <header>
        <div><span class="mark">✳</span><strong>CONTROL CENTER</strong></div>
        <div class="actions"><span id="queried"></span><button id="refresh">刷新</button></div>
      </header>
      <main>
        <section class="hero"><h1>设备与任务</h1><div class="badge" id="mode">CONTROL</div></section>
        <section class="stats" id="stats"></section>
        <nav class="nav" aria-label="管理视图"><button data-view="attention" class="active">待处理</button><button data-view="devices">设备</button><button data-view="tasks">任务</button></nav>
        <form class="toolbar" id="search-form"><label><span>全局搜索</span><input id="query" placeholder="设备 ID、task_ref、session_id 或标题" autocomplete="off" /></label><label id="status-filter" hidden><span>任务状态</span><select id="status"><option value="">全部状态</option><option value="running">运行中</option><option value="idle">空闲</option><option value="rescheduling">排队中</option><option value="terminated">已终止</option></select></label><button>搜索</button></form>
        <div class="error" id="error" role="alert" hidden></div>
        <section class="workspace"><div class="list-pane" id="list-pane"></div><article class="detail" id="detail"><p class="empty">选择设备或任务查看详情。</p></article></section>
      </main>
    </div>
    <script src="/admin-assets/app.js"></script>
  </body>
</html>
