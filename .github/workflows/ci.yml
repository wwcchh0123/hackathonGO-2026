name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install voice codec dependencies
        run: sudo apt-get update && sudo apt-get install -y libopus-dev pkg-config
      - run: make check test build
      - name: Verify voice codec and browser audio
        run: |
          make voice-test voice-build
          node --test internal/voice/test/pcm.test.mjs
      - name: Generate coverage report
        run: make coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
